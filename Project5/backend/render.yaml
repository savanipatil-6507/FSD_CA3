services:
  - type: web
    name: hospital-appointment-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://your-frontend-app.vercel.app

databases:
  - name: hospital-db
    plan: free
    databaseName: hospital_appointments
    user: hospital_user

